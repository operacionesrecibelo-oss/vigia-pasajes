name: Vigia de pasajes

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ¿Toca revisar jetsmart.com? (1 vez por hora)
        id: js
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date +%-M)" -lt 15 ]; then
            echo "due=1" >> "$GITHUB_OUTPUT"
          else
            echo "due=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache del navegador
        if: steps.js.outputs.due == '1'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Instalar navegador
        if: steps.js.outputs.due == '1'
        run: python -m playwright install --with-deps chromium

      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: state
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar precios
        id: revisar
        env:
          CONFIG_VIAJE: ${{ secrets.CONFIG_VIAJE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JETSMART_DUE: ${{ steps.js.outputs.due }}
        shell: bash
        run: |
          set -o pipefail
          python vigia.py | tee salida.txt
          if grep -q FINALIZADO salida.txt; then echo "fin=1" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: estado-${{ github.run_id }}

      - name: Apagar al terminar el periodo
        if: steps.revisar.outputs.fin == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable vigia.yml --repo "${{ github.repository }}"
