name: Vigia de pasajes

# Cada ejecución hace UNA revisión en una máquina nueva de GitHub (Google bloquea
# si se consulta muchas veces desde la misma), espera hasta completar 15 minutos
# y lanza la siguiente. El cron queda como respaldo por si la cadena se corta.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  actions: write
  contents: read

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Marcar inicio
        run: echo "INICIO=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Cache del navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('requirements.txt') }}

      - name: Instalar navegador
        run: python -m playwright install --with-deps chromium

      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: state
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Revisar precios
        id: revisar
        shell: bash
        env:
          CONFIG_VIAJE: ${{ secrets.CONFIG_VIAJE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python vigia.py > salida.txt 2>&1 || true
          cat salida.txt
          if grep -q FINALIZADO salida.txt; then echo "fin=1" >> "$GITHUB_OUTPUT"; fi

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: estado-${{ github.run_id }}

      - name: Esperar y lanzar la siguiente revisión
        if: always() && steps.revisar.outputs.fin != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          espera=$(( 870 - ($(date +%s) - $INICIO) ))
          if [ $espera -gt 0 ]; then sleep $espera; fi
          gh workflow run vigia.yml --repo "${{ github.repository }}" --ref main

      - name: Apagar al terminar el periodo
        if: steps.revisar.outputs.fin == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable vigia.yml --repo "${{ github.repository }}"
