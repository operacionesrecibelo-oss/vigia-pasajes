name: Prueba
on:
  push:
    branches: [prueba]
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - env:
          CONFIG_VIAJE: ${{ secrets.CONFIG_VIAJE }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "0"
          DRY_RUN: "1"
          JETSMART_DUE: "0"
          STATE_FILE: /tmp/prueba/state.json
        run: python vigia.py
